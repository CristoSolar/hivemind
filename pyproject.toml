[project]
name = "hivemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2"]

[project.scripts]
hivemind-daemon = "hivemind.daemon:main"
hivemind = "hivemind.ui.app:main"

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.setuptools.package-data]
"hivemind.ui" = ["icons/*.svg"]
