[project]
name = "colmena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2"]

[project.scripts]
colmena-daemon = "colmena.daemon:main"
colmena = "colmena.ui.app:main"

[tool.setuptools.packages.find]
include = ["colmena*"]

[tool.setuptools.package-data]
"colmena.ui" = ["icons/*.svg"]
